name: Pages redirects
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --test tests/redirect.test.cjs
      - name: Voxel Wild survival regressions
        run: node --test voxel-wild/v2/core.test.cjs
      - run: |
          mkdir -p _site/nanogpt-macbook
          cp nanogpt-macbook/index.html _site/nanogpt-macbook/
          cp 404.html redirect.js _site/
          if [ -d voxel-wild ]; then cp -R voxel-wild _site/voxel-wild; fi
          touch _site/.nojekyll
      - name: Build and verify Voxel Wild 3
        run: |
          node voxel-wild/v3/build.cjs _site/voxel-wild/v3
          node --test _site/voxel-wild/v3/core.test.cjs _site/voxel-wild/v3/systems.test.cjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
